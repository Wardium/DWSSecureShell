<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gatekeeper Admin</title>
    <style>
        body {
            margin: 0; padding: 40px;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .container { display: flex; gap: 30px; }
        .glass-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        h2 { font-weight: 300; margin-top: 0; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .actions button {
            background: rgba(255, 255, 255, 0.1);
            border: none; color: white; padding: 8px 15px; border-radius: 10px;
            cursor: pointer; transition: 0.3s; margin-left: 5px;
        }
        .actions button:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-allow { color: #4cd964 !important; }
        .btn-revoke { color: #ff9500 !important; }
        .btn-ban { color: #ff3b30 !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Active Connections Panel -->
        <div class="glass-panel">
            <h2>Authorized Devices</h2>
            {% for ip, info in data.allowed_ips.items() %}
            <div class="item">
                <div>
                    <strong>{{ info.name }}</strong><br>
                    <small>{{ ip }} | Logged: {{ info.time }}</small>
                </div>
                <div class="actions">
                    <button class="btn-revoke" onclick="sendAction('revoke', '{{ ip }}')">Revoke</button>
                    <button class="btn-ban" onclick="sendAction('ban', '{{ ip }}')">Ban IP</button>
                </div>
            </div>
            {% endfor %}
        </div>

        <!-- Access Attempts Panel -->
        <div class="glass-panel">
            <h2>Access Attempts</h2>
            {% for ip, info in data.attempts.items() %}
            <div class="item">
                <div>
                    <strong>Unknown Device</strong><br>
                    <small>{{ ip }} | Attempts: {{ info.count }} | Last: {{ info.time }}</small>
                </div>
                <div class="actions">
                    <button class="btn-allow" onclick="allowDevice('{{ ip }}')">Allow Access</button>
                    <button class="btn-ban" onclick="sendAction('ban', '{{ ip }}')">Ban IP</button>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function allowDevice(ip) {
            let name = prompt("Enter a name for this device (e.g., Roku, Dylan's PC):");
            if (name) sendAction('allow', ip, name);
        }
        function sendAction(action, ip, name="") {
            fetch('/api/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action, ip: ip, name: name})
            }).then(() => window.location.reload());
        }
    </script>
</body>
</html>
