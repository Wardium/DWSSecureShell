<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DWS Server Shell - Node {{ server_id }}</title>
    
    <!-- Xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden; /* Prevent browser scrollbars; Xterm handles scrollback */
        }

        /* Full screen container with a clean 10px margin all around */
        #terminal-container {
            width: calc(100vw - 20px);
            height: calc(100vh - 20px);
            margin: 10px;
            background-color: #121212;
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 6px;
            overflow: hidden;
        }

        /* Ensure the internal xterm viewport fills the container and styles the scrollbar */
        .xterm {
            height: 100%;
            width: 100%;
        }
        
        .xterm-viewport::-webkit-scrollbar {
            width: 8px;
        }
        .xterm-viewport::-webkit-scrollbar-track {
            background: #121212;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: #3a3a3a;
            border-radius: 4px;
        }
        .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div id="terminal-container"></div>

    <!-- Socket.IO, Xterm.js, and Xterm Fit Addon -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>

    <script>
        const serverId = "{{ server_id }}";
        const socket = io();

        // 1. Initialize Xterm with scrollback history and 256-color dark theme
        const term = new Terminal({
            cursorBlink: true,
            scrollback: 5000, // Allows scrolling up 5,000 lines of history
            fontFamily: '"Cascadia Code", "Fira Code", Consolas, monospace',
            fontSize: 14,
            theme: {
                background: '#121212',
                foreground: '#e0e0e0',
                cursor: '#00ff9d'
            }
        });

        // 2. Load the FitAddon to calculate exact cols/rows based on screen size
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        const container = document.getElementById('terminal-container');
        term.open(container);
        fitAddon.fit();
        term.focus();

        // 3. Connect to backend SSH and send initial calculated cols/rows
        socket.on('connect', () => {
            fitAddon.fit();
            socket.emit('connect_ssh', {
                server_id: serverId,
                cols: term.cols,
                rows: term.rows
            });
        });

        // 4. Write incoming SSH output (including ANSI color codes) to terminal
        socket.on('ssh_output', (data) => {
            term.write(data.output);
        });

        // 5. Send user keystrokes to backend
        term.onData((data) => {
            socket.emit('ssh_input', { input: data });
        });

        // 6. Dynamically recalculate cols/rows when window shrinks or expands
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                fitAddon.fit();
                socket.emit('ssh_resize', {
                    cols: term.cols,
                    rows: term.rows
                });
            }, 100); // Debounced so dragging the window border doesn't spam packets
        });
    </script>
</body>
</html>
