<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HomeBase // Gatekeeper Watch</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      color: #ffffff;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
    }

    /* Passive telemetry overlay (zero options) */
    .hud-top-left {
      position: fixed;
      top: 20px;
      left: 24px;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(255, 255, 255, 0.42);
      text-transform: uppercase;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00ff88;
      box-shadow: 0 0 8px #00ff88;
      transition: background 0.3s, box-shadow 0.3s;
    }
    .pulse-dot.offline {
      background: #ff2244;
      box-shadow: 0 0 8px #ff2244;
    }

    .hud-top-right {
      position: fixed;
      top: 20px;
      right: 24px;
      pointer-events: none;
      display: flex;
      gap: 22px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: rgba(255, 255, 255, 0.38);
    }
    .stat-item span {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 600;
      margin-left: 4px;
    }

    .hud-bottom-left {
      position: fixed;
      bottom: 20px;
      left: 24px;
      pointer-events: none;
      display: flex;
      flex-direction: column-reverse;
      gap: 5px;
      max-width: 580px;
    }
    .feed-line {
      font-size: 11px;
      letter-spacing: 0.04em;
      color: rgba(255, 255, 255, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      animation: fadeIn 0.25s ease-out;
    }
    .feed-line.past-replay {
      opacity: 0.48;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hover Inspection Popup */
    #tooltip {
      position: fixed;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, -115%);
      background: rgba(6, 6, 9, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 12px 14px;
      min-width: 265px;
      max-width: 350px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.9), 0 0 18px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      transition: opacity 0.12s ease;
      z-index: 50;
    }
    #tooltip.visible {
      opacity: 1;
    }
    .tt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
      margin-bottom: 8px;
      gap: 10px;
    }
    .tt-ip {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
    }
    .tt-badge {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 2px 6px;
      text-transform: uppercase;
      border: 1px solid currentColor;
    }
    .tt-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      line-height: 1.55;
      gap: 12px;
    }
    .tt-label {
      color: rgba(255, 255, 255, 0.42);
      flex-shrink: 0;
    }
    .tt-val {
      color: rgba(255, 255, 255, 0.9);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div class="hud-top-left">
    <div id="connDot" class="pulse-dot"></div>
    <span id="connText">AUTH.TEAMEXIST.COM // LIVE + 4D STORM</span>
  </div>

  <div class="hud-top-right">
    <div class="stat-item">INSIDE<span id="statInside">0</span></div>
    <div class="stat-item">LOCK SCREEN<span id="statWaiting">0</span></div>
    <div class="stat-item">FAILED (4D)<span id="statPastFailed">0</span></div>
    <div class="stat-item">BANNED<span id="statBanned">0</span></div>
  </div>

  <div class="hud-bottom-left" id="eventFeed"></div>

  <div id="tooltip">
    <div class="tt-header">
      <span class="tt-ip" id="ttIp">--</span>
      <span class="tt-badge" id="ttBadge">--</span>
    </div>
    <div class="tt-row"><span class="tt-label">Location</span><span class="tt-val" id="ttLoc">--</span></div>
    <div class="tt-row"><span class="tt-label">Route</span><span class="tt-val" id="ttRoute">--</span></div>
    <div class="tt-row"><span class="tt-label">Detail</span><span class="tt-val" id="ttDetail">--</span></div>
    <div class="tt-row"><span class="tt-label">Device</span><span class="tt-val" id="ttDevice">--</span></div>
    <div class="tt-row"><span class="tt-label">Timestamp</span><span class="tt-val" id="ttTime">--</span></div>
  </div>

  <canvas id="stage"></canvas>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let W = window.innerWidth;
    let H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    const hb = {
      x: W / 2,
      y: H / 2,
      size: 220,
      shakeX: 0,
      shakeY: 0,
      shakeVX: 0,
      shakeVY: 0,
      greenGlow: 0,
      redGlow: 0,
      gateSide: null,
      gatePos: 0,
      gateOpen: 0
    };

    function resize() {
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      hb.x = W / 2;
      hb.y = H / 2;
      hb.size = Math.max(180, Math.min(250, Math.min(W, H) * 0.25));
    }
    window.addEventListener('resize', resize);
    resize();

    // Tornado geometry around HomeBase
    function getVortexBands() {
      const innerR = hb.size * 0.72 + 44;
      const outerRx = Math.max(innerR + 100, W * 0.45);
      const outerRy = Math.max(innerR + 75, H * 0.44);
      return { innerR, outerRx, outerRy };
    }

    function getStormPosition(sq, t) {
      const { innerR, outerRx, outerRy } = getVortexBands();
      const wobble = Math.sin(t * sq.wobbleFreq + sq.wobblePhase) * sq.wobbleAmp;
      const rx = innerR + sq.orbitNorm * (outerRx - innerR) + wobble;
      const ry = innerR + sq.orbitNorm * (outerRy - innerR) + wobble * 0.85;
      return {
        x: hb.x + Math.cos(sq.orbitAngle) * rx,
        y: hb.y + Math.sin(sq.orbitAngle) * ry,
        rx,
        ry
      };
    }

    const squares = [];
    const entityByKey = new Map();
    const particles = [];
    const shockwaves = [];

    // Subtle rotating tornado wind arcs
    const vortexRings = [
      { norm: 0.08, angle: 0.2, speed: -0.0085, dash: [22, 38], alpha: 0.055 },
      { norm: 0.36, angle: 2.1, speed: -0.0055, dash: [34, 54], alpha: 0.042 },
      { norm: 0.68, angle: 4.0, speed: -0.0036, dash: [42, 72], alpha: 0.032 },
      { norm: 0.94, angle: 1.1, speed: -0.0024, dash: [28, 90], alpha: 0.025 }
    ];

    // Queue of real historical failed attempts (within 4-day retention window)
    let pastFailedQueue = [];
    let replayCursor = 0;

    const MIN_AMBIENT_SQUARES = 22;
    const MAX_STORM_REAL = 95;
    let frameTick = 0;

    function createSquareObj(overrides = {}) {
      const orbitNorm = Math.pow(Math.random(), 0.82); // Slightly denser toward inner storm bands
      const orbitAngle = Math.random() * Math.PI * 2;
      // Inner bands whip faster than outer bands (cyclone profile, counter-clockwise)
      const baseOmega = (0.0145 - orbitNorm * 0.0088) * (0.88 + Math.random() * 0.24);
      const sq = {
        id: `sq_${Date.now()}_${Math.random()}`,
        key: null,
        isClaimed: false,
        isPastReplay: false,
        replayStamp: '',
        state: 'STORM',
        orbitNorm,
        orbitAngle,
        orbitSpeed: -baseOmega,
        wobbleAmp: 6 + Math.random() * 14,
        wobbleFreq: 0.012 + Math.random() * 0.018,
        wobblePhase: Math.random() * Math.PI * 2,
        x: hb.x,
        y: hb.y,
        vx: 0,
        vy: 0,
        size: 9 + Math.random() * 3,
        angle: Math.random() * Math.PI * 2,
        vAngle: -(0.025 + (1 - orbitNorm) * 0.045),
        color: '#475569',
        trail: [],
        pulse: 0,
        ip: 'Ambient Node',
        badge: 'STORM DEBRIS',
        badgeColor: '#475569',
        location: 'Outer Vortex',
        route: 'Awaiting Traffic',
        detail: 'Circling HomeBase perimeter',
        device: '--',
        time: '--',
        sessionId: '',
        ...overrides
      };
      if (sq.state === 'STORM') {
        const pos = getStormPosition(sq, frameTick);
        sq.x = pos.x;
        sq.y = pos.y;
      }
      return sq;
    }

    function ensureAmbientFloor() {
      const ambientCount = squares.filter(s => !s.isClaimed).length;
      const realStormCount = squares.filter(s => s.isClaimed && s.state !== 'INSIDE').length;
      const desiredAmbient = Math.max(8, MIN_AMBIENT_SQUARES - Math.floor(realStormCount * 0.5));

      if (ambientCount < desiredAmbient) {
        for (let i = 0; i < desiredAmbient - ambientCount; i++) {
          squares.push(createSquareObj());
        }
      } else if (ambientCount > desiredAmbient + 6) {
        let toRemove = ambientCount - desiredAmbient;
        for (let i = squares.length - 1; i >= 0 && toRemove > 0; i--) {
          if (!squares[i].isClaimed && squares[i].state === 'STORM') {
            squares.splice(i, 1);
            toRemove--;
          }
        }
      }
    }
    ensureAmbientFloor();

    function releaseSquare(sq) {
      if (sq.key && entityByKey.get(sq.key) === sq) entityByKey.delete(sq.key);
      if (sq.ip && entityByKey.get(sq.ip) === sq) entityByKey.delete(sq.ip);
      const idx = squares.indexOf(sq);
      if (idx !== -1) squares.splice(idx, 1);
    }

    function claimOrGetSquare(key, ip, preferInside = false) {
      if (entityByKey.has(key)) return entityByKey.get(key);
      if (entityByKey.has(ip)) {
        const sq = entityByKey.get(ip);
        entityByKey.set(key, sq);
        sq.key = key;
        return sq;
      }

      // Recycle an unclaimed ambient square first if available
      let candidate = squares.find(s => !s.isClaimed && s.state === 'STORM');
      if (!candidate) {
        // Respect storm density cap by recycling the oldest idle non-active storm square if full
        const realStorm = squares.filter(s => s.isClaimed && s.state === 'STORM');
        if (!preferInside && realStorm.length >= MAX_STORM_REAL) {
          candidate = realStorm[0];
          if (candidate.key && entityByKey.get(candidate.key) === candidate) entityByKey.delete(candidate.key);
          if (candidate.ip && entityByKey.get(candidate.ip) === candidate) entityByKey.delete(candidate.ip);
        } else {
          candidate = createSquareObj({ size: 11.5 });
          squares.push(candidate);
        }
      }

      candidate.isClaimed = true;
      candidate.isPastReplay = false;
      candidate.replayStamp = '';
      candidate.key = key;
      candidate.ip = ip;
      candidate.size = 11.5;
      candidate.color = '#94a3b8';
      candidate.badge = 'KNOWN IP';
      candidate.badgeColor = '#94a3b8';

      if (preferInside) {
        candidate.state = 'INSIDE';
        candidate.x = hb.x + (Math.random() - 0.5) * (hb.size * 0.62);
        candidate.y = hb.y + (Math.random() - 0.5) * (hb.size * 0.62);
        candidate.vx = (Math.random() - 0.5) * 1.2;
        candidate.vy = (Math.random() - 0.5) * 1.2;
        candidate.trail.length = 0;
      }

      entityByKey.set(key, candidate);
      entityByKey.set(ip, candidate);
      return candidate;
    }

    function getHomeBaseEdgeTarget(sq) {
      const half = hb.size / 2;
      const dx = sq.x - hb.x;
      const dy = sq.y - hb.y;
      const pad = sq.size + 6;
      if (Math.abs(dx) > Math.abs(dy)) {
        const side = dx > 0 ? 'right' : 'left';
        const tx = hb.x + (dx > 0 ? half + pad : -half - pad);
        const ty = hb.y + Math.max(-half + 24, Math.min(half - 24, dy * 0.35));
        return { x: tx, y: ty, side, gatePos: ty - hb.y };
      } else {
        const side = dy > 0 ? 'bottom' : 'top';
        const tx = hb.x + Math.max(-half + 24, Math.min(half - 24, dx * 0.35));
        const ty = hb.y + (dy > 0 ? half + pad : -half - pad);
        return { x: tx, y: ty, side, gatePos: tx - hb.x };
      }
    }

    function spawnSparks(x, y, color, count = 18, alphaScale = 1.0) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const spd = (1.2 + Math.random() * 4.8) * (alphaScale < 0.7 ? 0.7 : 1.0);
        particles.push({
          x,
          y,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          life: alphaScale,
          decay: 0.024 + Math.random() * 0.025,
          color,
          size: 2 + Math.random() * 2.2
        });
      }
    }

    function triggerGreenPass(sq, targetInfo) {
      hb.greenGlow = 1.0;
      if (targetInfo) {
        hb.gateSide = targetInfo.side;
        hb.gatePos = targetInfo.gatePos;
        hb.gateOpen = 1.0;
      }
      shockwaves.push({
        x: hb.x,
        y: hb.y,
        size: hb.size,
        alpha: 0.75,
        color: '#00ff88'
      });
      spawnSparks(sq.x, sq.y, '#00ff88', 14, 1.0);
    }

    function triggerRedReject(sq, isPastReplay = false) {
      const impactAngle = Math.atan2(hb.y - sq.y, hb.x - sq.x);

      if (isPastReplay) {
        hb.redGlow = Math.max(hb.redGlow, 0.38);
        hb.shakeVX += Math.cos(impactAngle) * 5.0 + (Math.random() - 0.5) * 3.0;
        hb.shakeVY += Math.sin(impactAngle) * 5.0 + (Math.random() - 0.5) * 3.0;

        shockwaves.push({
          x: hb.x,
          y: hb.y,
          size: hb.size,
          alpha: 0.32,
          color: '#9e2a3b'
        });
        spawnSparks(sq.x, sq.y, '#b83348', 10, 0.48);

        sq.state = 'REJECTED_OUT';
        sq.color = '#9e2a3b';
        sq.vAngle = -0.18;
      } else {
        hb.redGlow = 1.0;
        hb.shakeVX += Math.cos(impactAngle) * 14 + (Math.random() - 0.5) * 9;
        hb.shakeVY += Math.sin(impactAngle) * 14 + (Math.random() - 0.5) * 9;

        shockwaves.push({
          x: hb.x,
          y: hb.y,
          size: hb.size,
          alpha: 0.85,
          color: '#ff2244'
        });
        spawnSparks(sq.x, sq.y, '#ff2244', 24, 1.0);

        sq.state = 'REJECTED_OUT';
        sq.color = '#ff2244';
        sq.vAngle = -0.3;
      }

      // Launch outward from HomeBase with tangential swirl kick so it hooks back into the tornado
      const outAngle = Math.atan2(sq.y - hb.y, sq.x - hb.x);
      const tangAngle = outAngle - Math.PI / 2; // Counter-clockwise swirl direction
      const radialSpd = isPastReplay ? 5.2 : 8.2;
      const tangSpd = isPastReplay ? 3.2 : 4.5;

      sq.orbitAngle = outAngle - 0.35;
      sq.vx = Math.cos(outAngle) * radialSpd + Math.cos(tangAngle) * tangSpd;
      sq.vy = Math.sin(outAngle) * radialSpd + Math.sin(tangAngle) * tangSpd;
    }

    const feedEl = document.getElementById('eventFeed');
    function pushFeedLine(ev, isPastReplay = false) {
      const div = document.createElement('div');
      div.className = isPastReplay ? 'feed-line past-replay' : 'feed-line';
      let color = '#94a3b8';
      if (['LOGIN_SUCCESS', 'AUTH_OK', 'VERIFY_OK', 'ADMIN_ALLOW'].includes(ev.type)) color = '#00ff88';
      else if (['REJECT', 'LOGIN_FAIL', 'VERIFY_FAIL', 'ADMIN_BAN'].includes(ev.type)) {
        color = isPastReplay ? '#b84a59' : '#ff3355';
      } else if (['LOCK_WAIT', 'LOCK_ABANDON'].includes(ev.type)) color = '#ffbe0b';

      const stamp = ev.time || '--';
      const prefix = isPastReplay ? `[PAST // ${stamp}]` : `[LIVE // ${stamp.split(' ')[1] || stamp}]`;
      div.innerHTML = `<span style="color:rgba(255,255,255,0.38)">${prefix}</span> <span style="color:${color};font-weight:700">${ev.type}</span> <span style="color:#fff">${ev.ip}</span> <span style="color:rgba(255,255,255,0.45)">${ev.route} — ${ev.detail || ''}</span>`;
      feedEl.prepend(div);
      while (feedEl.children.length > 6) {
        feedEl.removeChild(feedEl.lastChild);
      }
    }

    function handleLiveEvent(ev) {
      pushFeedLine(ev, false);

      const key = ev.session_id || ev.ip;
      const sq = claimOrGetSquare(key, ev.ip, false);

      sq.isPastReplay = false;
      sq.replayStamp = '';
      sq.ip = ev.ip;
      sq.location = ev.location || sq.location;
      sq.route = ev.route || sq.route;
      sq.detail = ev.detail || sq.detail;
      sq.device = ev.device_info || sq.device;
      sq.time = ev.time || sq.time;
      if (ev.session_id) sq.sessionId = ev.session_id;

      if (sq.state === 'INSIDE' && ['AUTH_OK', 'VERIFY_OK'].includes(ev.type)) {
        sq.pulse = 1.0;
        sq.color = '#00ff88';
        sq.badge = 'ACTIVE SESSION (LIVE)';
        sq.badgeColor = '#00ff88';
        hb.greenGlow = Math.max(hb.greenGlow, 0.55);
        spawnSparks(sq.x, sq.y, '#00ff88', 8, 1.0);
        return;
      }

      if (ev.type === 'LOCK_WAIT') {
        const edge = getHomeBaseEdgeTarget(sq);
        sq.targetX = edge.x;
        sq.targetY = edge.y;
        sq.targetSide = edge.side;
        sq.targetGatePos = edge.gatePos;
        sq.afterFlight = 'WAIT_AT_LOCK';
        sq.state = 'FLYING_IN';
        sq.color = '#ffbe0b';
        sq.badge = 'AT LOCK SCREEN (LIVE)';
        sq.badgeColor = '#ffbe0b';
        return;
      }

      if (ev.type === 'LOCK_ABANDON') {
        sq.badge = 'LEFT LOCK SCREEN';
        sq.badgeColor = '#94a3b8';
        sq.color = '#94a3b8';
        const outAngle = Math.atan2(sq.y - hb.y, sq.x - hb.x);
        sq.orbitAngle = outAngle;
        sq.vx = Math.cos(outAngle) * 5;
        sq.vy = Math.sin(outAngle) * 5;
        sq.state = 'REJECTED_OUT';
        return;
      }

      if (['LOGOUT', 'REVOKE', 'ADMIN_BAN'].includes(ev.type)) {
        sq.badge = ev.type === 'ADMIN_BAN' ? 'BANNED IP' : 'DISCONNECTED';
        sq.badgeColor = ev.type === 'ADMIN_BAN' ? '#ff2244' : '#94a3b8';
        sq.color = ev.type === 'ADMIN_BAN' ? '#ff2244' : '#94a3b8';
        const outAngle = Math.atan2(sq.y - hb.y, sq.x - hb.x);
        sq.orbitAngle = outAngle;
        sq.vx = Math.cos(outAngle) * 6;
        sq.vy = Math.sin(outAngle) * 6;
        sq.state = 'REJECTED_OUT';
        if (ev.type === 'ADMIN_BAN') {
          hb.redGlow = 0.8;
          spawnSparks(sq.x, sq.y, '#ff2244', 16, 1.0);
        }
        return;
      }

      if (['LOGIN_SUCCESS', 'AUTH_OK', 'VERIFY_OK', 'ADMIN_ALLOW'].includes(ev.type)) {
        const edge = getHomeBaseEdgeTarget(sq);
        sq.targetX = edge.x;
        sq.targetY = edge.y;
        sq.targetSide = edge.side;
        sq.targetGatePos = edge.gatePos;
        sq.afterFlight = 'ALLOW_IN';
        sq.badge = 'AUTHORIZED (LIVE)';
        sq.badgeColor = '#00ff88';
        sq.color = '#00ff88';

        if (sq.state === 'WAITING_LOCK') {
          triggerGreenPass(sq, { side: sq.targetSide, gatePos: sq.targetGatePos });
          sq.state = 'ENTERING';
        } else {
          sq.state = 'FLYING_IN';
        }
        return;
      }

      if (['REJECT', 'LOGIN_FAIL', 'VERIFY_FAIL'].includes(ev.type)) {
        const edge = getHomeBaseEdgeTarget(sq);
        sq.targetX = edge.x;
        sq.targetY = edge.y;
        sq.targetSide = edge.side;
        sq.targetGatePos = edge.gatePos;
        sq.afterFlight = 'REJECT_OUT';
        sq.badge = ev.status === 403 ? 'LIVE BANNED (403)' : 'LIVE BLOCKED (401)';
        sq.badgeColor = '#ff2244';

        if (sq.state === 'WAITING_LOCK') {
          triggerRedReject(sq, false);
        } else {
          sq.color = '#ffaa00';
          sq.state = 'FLYING_IN';
        }
      }
    }

    // Periodically peel a past failed IP out of the tornado to jump at HomeBase
    function triggerNextPastFailedReplay() {
      if (pastFailedQueue.length === 0) return;

      // Keep at most 2 replay lunges in flight at once so the storm stays legible
      const activeReplays = squares.filter(s => s.isPastReplay && (s.state === 'FLYING_IN' || s.state === 'REJECTED_OUT')).length;
      if (activeReplays >= 2) return;

      // Try up to 5 items to find one currently swirling in the storm
      for (let tries = 0; tries < Math.min(5, pastFailedQueue.length); tries++) {
        const ev = pastFailedQueue[replayCursor % pastFailedQueue.length];
        replayCursor = (replayCursor + 1) % pastFailedQueue.length;

        const sq = claimOrGetSquare(ev.ip, ev.ip, false);
        if (sq.state !== 'STORM') continue;

        sq.isPastReplay = true;
        sq.replayStamp = ev.time || 'PAST ATTEMPT';
        sq.ip = ev.ip;
        sq.location = ev.location || sq.location;
        sq.route = ev.route || '/auth';
        sq.detail = ev.detail || 'Past failed attempt';
        sq.device = ev.device_info || sq.device;
        sq.time = ev.time || '--';
        sq.badge = `PAST ${ev.type} (REPLAY)`;
        sq.badgeColor = '#b84a59';
        sq.color = '#b83348';

        const edge = getHomeBaseEdgeTarget(sq);
        sq.targetX = edge.x;
        sq.targetY = edge.y;
        sq.targetSide = edge.side;
        sq.targetGatePos = edge.gatePos;
        sq.afterFlight = 'REJECT_OUT';
        sq.state = 'FLYING_IN';

        pushFeedLine(ev, true);
        break;
      }
    }

    function scheduleNextReplay() {
      const delay = 2200 + Math.random() * 1900;
      setTimeout(() => {
        triggerNextPastFailedReplay();
        scheduleNextReplay();
      }, delay);
    }

    let lastEventId = 0;
    let firstSync = true;

    async function pollTelemetry() {
      try {
        const res = await fetch(`/api/telemetry?since=${lastEventId}`, { credentials: 'include' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        document.getElementById('connDot').classList.remove('offline');
        const retentionDays = data.retention_days || 4;
        document.getElementById('connText').textContent = `AUTH.TEAMEXIST.COM // LIVE + ${retentionDays}D STORM`;

        const activeSessions = data.active_sessions || {};
        const allowedIps = data.allowed_ips || {};
        const pendingLogins = data.pending_logins || {};
        const attempts = data.attempts || {};
        const bannedIps = data.banned_ips || {};
        const knownIps = data.known_ips || {};
        const failedHistory = data.failed_history || [];

        const insideCount = Object.keys(activeSessions).length + Object.keys(allowedIps).length;
        document.getElementById('statInside').textContent = insideCount;
        document.getElementById('statWaiting').textContent = Object.keys(pendingLogins).length;
        document.getElementById('statBanned').textContent = Object.keys(bannedIps).length;

        // Replace replay queue with server's pruned 4-day failed_history
        pastFailedQueue = failedHistory.slice();
        if (pastFailedQueue.length > 0) {
          replayCursor = replayCursor % pastFailedQueue.length;
        } else {
          replayCursor = 0;
        }
        document.getElementById('statPastFailed').textContent = pastFailedQueue.length;

        // Build set of valid IPs/keys within the 4-day window
        const validKeys = new Set([
          ...Object.keys(activeSessions),
          ...Object.keys(allowedIps).map(ip => `allow_${ip}`),
          ...Object.keys(allowedIps),
          ...Object.keys(pendingLogins),
          ...Object.keys(attempts),
          ...Object.keys(knownIps),
          ...failedHistory.map(ev => ev.ip)
        ]);
        for (const sess of Object.values(activeSessions)) {
          if (sess && sess.ip) validKeys.add(sess.ip);
        }

        // Evict storm squares whose data aged past the 4-day window on the server
        for (let i = squares.length - 1; i >= 0; i--) {
          const sq = squares[i];
          if (!sq.isClaimed) continue;

          if (sq.state === 'INSIDE') {
            const stillActive = (sq.sessionId && activeSessions[sq.sessionId]) ||
                                (sq.key && activeSessions[sq.key]) ||
                                allowedIps[sq.ip];
            if (!stillActive) {
              const outAngle = Math.atan2(sq.y - hb.y, sq.x - hb.x);
              sq.orbitAngle = outAngle;
              sq.vx = Math.cos(outAngle) * 4.5;
              sq.vy = Math.sin(outAngle) * 4.5;
              sq.color = '#64748b';
              sq.badge = 'SESSION ENDED';
              sq.badgeColor = '#64748b';
              sq.state = 'REJECTED_OUT';
            }
          } else if (sq.state === 'STORM' && !validKeys.has(sq.ip) && !validKeys.has(sq.key)) {
            releaseSquare(sq);
          }
        }

        const failedIpSet = new Set(failedHistory.map(ev => ev.ip));

        if (firstSync) {
          for (const [sessId, info] of Object.entries(activeSessions)) {
            const sq = claimOrGetSquare(sessId, info.ip || 'Session', true);
            sq.isPastReplay = false;
            sq.state = 'INSIDE';
            sq.color = '#00ff88';
            sq.badge = 'ACTIVE SESSION';
            sq.badgeColor = '#00ff88';
            sq.location = info.location || 'Unknown';
            sq.device = info.device_info || '--';
            sq.time = info.last_seen || info.time || '--';
            sq.route = info.last_uri || '/auth';
            sq.detail = `Session ${sessId.slice(0, 8)}...`;
            sq.sessionId = sessId;
          }

          for (const [ip, info] of Object.entries(allowedIps)) {
            const sq = claimOrGetSquare(`allow_${ip}`, ip, true);
            sq.isPastReplay = false;
            sq.state = 'INSIDE';
            sq.color = '#00e5ff';
            sq.badge = 'WHITELISTED IP';
            sq.badgeColor = '#00e5ff';
            sq.location = 'Whitelisted';
            sq.detail = info.name || 'Allowed IP';
            sq.time = info.time || '--';
            sq.route = '/auth';
          }

          for (const [ip, info] of Object.entries(pendingLogins)) {
            const sq = claimOrGetSquare(ip, ip, false);
            const edge = getHomeBaseEdgeTarget(sq);
            sq.x = edge.x;
            sq.y = edge.y;
            sq.targetX = edge.x;
            sq.targetY = edge.y;
            sq.state = 'WAITING_LOCK';
            sq.color = '#ffbe0b';
            sq.badge = 'AT LOCK SCREEN';
            sq.badgeColor = '#ffbe0b';
            sq.location = info.location || 'Unknown';
            sq.device = info.device_info || '--';
            sq.time = info.time || '--';
            sq.route = '/login';
            sq.detail = 'Waiting for password input';
          }

          // Populate recent 4-day visitors into the swirling storm (most recent first, capped cleanly)
          const recentKnown = Object.entries(knownIps)
            .sort((a, b) => (b[1].last_seen || '').localeCompare(a[1].last_seen || ''))
            .slice(0, MAX_STORM_REAL);

          for (const [ip, info] of recentKnown) {
            if (!entityByKey.has(ip)) {
              const sq = claimOrGetSquare(ip, ip, false);
              sq.location = info.location || 'Unknown';
              sq.device = info.device_info || '--';
              sq.route = info.last_route || '--';
              sq.time = info.last_seen || '--';
              if (failedIpSet.has(ip)) {
                sq.color = '#9e2a3b';
                sq.isPastReplay = true;
                sq.replayStamp = info.last_seen || '';
                sq.badge = 'PAST FAILED (4D)';
                sq.badgeColor = '#b84a59';
              } else {
                sq.color = '#64748b';
                sq.badge = 'RECENT VISITOR';
                sq.badgeColor = '#64748b';
              }
            }
          }

          // Seed any failed_history IPs not yet in known_ips
          for (const ev of failedHistory.slice(-MAX_STORM_REAL)) {
            if (!entityByKey.has(ev.ip)) {
              const sq = claimOrGetSquare(ev.ip, ev.ip, false);
              sq.color = '#9e2a3b';
              sq.isPastReplay = true;
              sq.replayStamp = ev.time || '';
              sq.location = ev.location || 'Unknown';
              sq.device = ev.device_info || '--';
              sq.route = ev.route || '/auth';
              sq.detail = ev.detail || 'Past failed attempt';
              sq.time = ev.time || '--';
              sq.badge = `PAST ${ev.type}`;
              sq.badgeColor = '#b84a59';
            }
          }

          for (const [ip, info] of Object.entries(attempts)) {
            const sq = claimOrGetSquare(ip, ip, false);
            if (sq.state === 'STORM') {
              sq.color = '#9e2a3b';
              sq.isPastReplay = true;
              sq.replayStamp = info.time || '';
              sq.badge = `RECENT ATTEMPTS (${info.count})`;
              sq.badgeColor = '#b84a59';
              sq.location = info.location || sq.location;
              sq.time = info.time || sq.time;
              sq.detail = `${info.count} failed attempt(s)`;
            }
          }

          lastEventId = data.last_event_id || 0;
          firstSync = false;
          ensureAmbientFloor();

          setTimeout(() => {
            triggerNextPastFailedReplay();
            scheduleNextReplay();
          }, 900);
        } else {
          const newEvents = data.events || [];
          for (const ev of newEvents) {
            if (ev.id > lastEventId) {
              lastEventId = ev.id;
              handleLiveEvent(ev);
            }
          }
          ensureAmbientFloor();
        }
      } catch (err) {
        document.getElementById('connDot').classList.add('offline');
      }
    }

    setInterval(pollTelemetry, 1000);
    pollTelemetry();

    const mouse = { x: -9999, y: -9999 };
    let hoveredSquare = null;
    const tooltip = document.getElementById('tooltip');

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('mouseleave', () => {
      mouse.x = -9999;
      mouse.y = -9999;
    });

    function resolveInsideCollisions(group) {
      for (let i = 0; i < group.length; i++) {
        for (let j = i + 1; j < group.length; j++) {
          const a = group[i];
          const b = group[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const minDist = (a.size + b.size) * 0.82;
          const distSq = dx * dx + dy * dy;
          if (distSq > 0 && distSq < minDist * minDist) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const ny = dy / dist;
            const overlap = (minDist - dist) * 0.5;
            a.x -= nx * overlap;
            a.y -= ny * overlap;
            b.x += nx * overlap;
            b.y += ny * overlap;

            const kx = a.vx - b.vx;
            const ky = a.vy - b.vy;
            const p = kx * nx + ky * ny;
            if (p > 0) {
              a.vx -= p * nx * 0.85;
              a.vy -= p * ny * 0.85;
              b.vx += p * nx * 0.85;
              b.vy += p * ny * 0.85;
            }
          }
        }
      }
    }

    // Soft local repulsion in the vortex so squares never clump into static blobs
    function resolveStormSeparation(group) {
      for (let i = 0; i < group.length; i++) {
        const a = group[i];
        if (a === hoveredSquare) continue;
        for (let j = i + 1; j < group.length; j++) {
          const b = group[j];
          if (b === hoveredSquare) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const minDist = (a.size + b.size) * 0.95;
          const distSq = dx * dx + dy * dy;
          if (distSq > 0.01 && distSq < minDist * minDist) {
            const dist = Math.sqrt(distSq);
            const push = (minDist - dist) * 0.06;
            const nx = dx / dist;
            const ny = dy / dist;
            a.x -= nx * push;
            a.y -= ny * push;
            b.x += nx * push;
            b.y += ny * push;
          }
        }
      }
    }

    function updatePhysics() {
      frameTick++;

      for (const ring of vortexRings) {
        ring.angle += ring.speed;
      }

      const springK = 0.28;
      const damping = 0.72;
      hb.shakeVX = (hb.shakeVX - hb.shakeX * springK) * damping;
      hb.shakeVY = (hb.shakeVY - hb.shakeY * springK) * damping;
      hb.shakeX += hb.shakeVX;
      hb.shakeY += hb.shakeVY;

      hb.greenGlow = Math.max(0, hb.greenGlow - 0.022);
      hb.redGlow = Math.max(0, hb.redGlow - 0.025);
      hb.gateOpen = Math.max(0, hb.gateOpen - 0.03);

      const half = hb.size / 2;
      const innerPad = 14;

      hoveredSquare = null;
      let minHoverDist = 28;

      for (const sq of squares) {
        const dMouse = Math.hypot(mouse.x - sq.x, mouse.y - sq.y);
        if (dMouse < minHoverDist) {
          minHoverDist = dMouse;
          hoveredSquare = sq;
        }
      }

      for (const sq of squares) {
        const isHovered = (sq === hoveredSquare);
        const speedScale = isHovered ? 0.06 : 1.0;

        sq.angle += sq.vAngle * speedScale;
        if (Math.abs(sq.vAngle) > 0.075) {
          sq.vAngle *= 0.98;
        } else if (Math.abs(sq.vAngle) < 0.015) {
          sq.vAngle -= 0.002;
        }

        if (sq.pulse > 0) sq.pulse = Math.max(0, sq.pulse - 0.03);

        if (sq.state === 'STORM') {
          sq.orbitAngle += sq.orbitSpeed * speedScale;
          const target = getStormPosition(sq, frameTick);

          // Smooth spring-follow onto swirling elliptical vortex track
          sq.vx = (sq.vx + (target.x - sq.x) * 0.09) * 0.78;
          sq.vy = (sq.vy + (target.y - sq.y) * 0.09) * 0.78;
          sq.x += sq.vx * speedScale;
          sq.y += sq.vy * speedScale;

          if (!isHovered) {
            sq.trail.push({ x: sq.x, y: sq.y });
            const maxTrail = sq.isClaimed ? 6 : 4;
            if (sq.trail.length > maxTrail) sq.trail.shift();
          }

        } else if (sq.state === 'FLYING_IN') {
          sq.trail.push({ x: sq.x, y: sq.y });
          if (sq.trail.length > 16) sq.trail.shift();

          const dx = sq.targetX - sq.x;
          const dy = sq.targetY - sq.y;
          const dist = Math.hypot(dx, dy);

          if (dist < 9) {
            sq.x = sq.targetX;
            sq.y = sq.targetY;
            sq.vx = 0;
            sq.vy = 0;

            if (sq.afterFlight === 'WAIT_AT_LOCK') {
              sq.state = 'WAITING_LOCK';
            } else if (sq.afterFlight === 'ALLOW_IN') {
              triggerGreenPass(sq, { side: sq.targetSide, gatePos: sq.targetGatePos });
              sq.state = 'ENTERING';
            } else {
              triggerRedReject(sq, sq.isPastReplay);
            }
          } else {
            // Smoothly steer out of tangential vortex momentum into HomeBase
            const maxSpd = sq.isPastReplay ? 6.8 : 10.2;
            const desiredSpd = Math.min(maxSpd, Math.max(3.0, dist * 0.12));
            const desiredVX = (dx / dist) * desiredSpd;
            const desiredVY = (dy / dist) * desiredSpd;
            sq.vx += (desiredVX - sq.vx) * 0.22;
            sq.vy += (desiredVY - sq.vy) * 0.22;
            sq.x += sq.vx * speedScale;
            sq.y += sq.vy * speedScale;
            sq.vAngle = sq.isPastReplay ? -0.11 : -0.17;
          }

        } else if (sq.state === 'WAITING_LOCK') {
          sq.trail.length = 0;
          const edge = getHomeBaseEdgeTarget(sq);
          sq.x += (edge.x - sq.x) * 0.15;
          sq.y += (edge.y - sq.y) * 0.15;
          sq.vAngle = -0.04;

        } else if (sq.state === 'ENTERING') {
          sq.trail.push({ x: sq.x, y: sq.y });
          if (sq.trail.length > 10) sq.trail.shift();

          const dx = hb.x - sq.x;
          const dy = hb.y - sq.y;
          const dist = Math.hypot(dx, dy);
          sq.x += (dx / Math.max(1, dist)) * 4.5;
          sq.y += (dy / Math.max(1, dist)) * 4.5;

          if (Math.abs(sq.x - hb.x) < half - 26 && Math.abs(sq.y - hb.y) < half - 26) {
            sq.state = 'INSIDE';
            sq.trail.length = 0;
            sq.vx = (Math.random() - 0.5) * 1.5;
            sq.vy = (Math.random() - 0.5) * 1.5;
          }

        } else if (sq.state === 'INSIDE') {
          sq.x += sq.vx * speedScale;
          sq.y += sq.vy * speedScale;

          const spd = Math.hypot(sq.vx, sq.vy);
          if (spd < 0.45) {
            sq.vx += (Math.random() - 0.5) * 0.25;
            sq.vy += (Math.random() - 0.5) * 0.25;
          } else if (spd > 1.8) {
            sq.vx *= 0.96;
            sq.vy *= 0.96;
          }

          const minX = hb.x - half + innerPad;
          const maxX = hb.x + half - innerPad;
          const minY = hb.y - half + innerPad;
          const maxY = hb.y + half - innerPad;

          if (sq.x < minX) { sq.x = minX; sq.vx = Math.abs(sq.vx); sq.vAngle = -sq.vAngle; }
          if (sq.x > maxX) { sq.x = maxX; sq.vx = -Math.abs(sq.vx); sq.vAngle = -sq.vAngle; }
          if (sq.y < minY) { sq.y = minY; sq.vy = Math.abs(sq.vy); sq.vAngle = -sq.vAngle; }
          if (sq.y > maxY) { sq.y = maxY; sq.vy = -Math.abs(sq.vy); sq.vAngle = -sq.vAngle; }

        } else if (sq.state === 'REJECTED_OUT') {
          sq.trail.push({ x: sq.x, y: sq.y });
          if (sq.trail.length > 15) sq.trail.shift();

          // Keep advancing its tornado angle so it curves smoothly back into the moving stream
          sq.orbitAngle += sq.orbitSpeed * 0.9;
          const rejoin = getStormPosition(sq, frameTick);
          const dx = rejoin.x - sq.x;
          const dy = rejoin.y - sq.y;
          const dist = Math.hypot(dx, dy);

          sq.vx += (dx / Math.max(1, dist)) * 0.52;
          sq.vy += (dy / Math.max(1, dist)) * 0.52;
          sq.vx *= 0.93;
          sq.vy *= 0.93;
          sq.x += sq.vx * speedScale;
          sq.y += sq.vy * speedScale;

          if (dist < 42) {
            sq.state = 'STORM';
            if (sq.isPastReplay) sq.color = '#9e2a3b';
          }
        }
      }

      resolveInsideCollisions(squares.filter(s => s.state === 'INSIDE'));
      resolveStormSeparation(squares.filter(s => s.state === 'STORM'));

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= p.decay;
        if (p.life <= 0) particles.splice(i, 1);
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.size += 5.5;
        sw.alpha -= 0.024;
        if (sw.alpha <= 0) shockwaves.splice(i, 1);
      }

      if (hoveredSquare) {
        tooltip.classList.add('visible');
        const clampedX = Math.max(165, Math.min(W - 165, hoveredSquare.x));
        const clampedY = Math.max(155, hoveredSquare.y - 14);
        tooltip.style.left = `${clampedX}px`;
        tooltip.style.top = `${clampedY}px`;

        document.getElementById('ttIp').textContent = hoveredSquare.ip;
        const badgeEl = document.getElementById('ttBadge');
        badgeEl.textContent = hoveredSquare.badge;
        badgeEl.style.color = hoveredSquare.badgeColor;
        document.getElementById('ttLoc').textContent = hoveredSquare.location;
        document.getElementById('ttRoute').textContent = hoveredSquare.route;
        document.getElementById('ttDetail').textContent = hoveredSquare.detail;
        document.getElementById('ttDevice').textContent = hoveredSquare.device;
        document.getElementById('ttTime').textContent = hoveredSquare.time;
      } else {
        tooltip.classList.remove('visible');
      }
    }

    function drawVortexBackdrop() {
      const { innerR, outerRx, outerRy } = getVortexBands();
      ctx.save();
      for (const ring of vortexRings) {
        const rx = innerR + ring.norm * (outerRx - innerR);
        const ry = innerR + ring.norm * (outerRy - innerR);
        ctx.save();
        ctx.translate(hb.x, hb.y);
        ctx.strokeStyle = `rgba(255, 255, 255, ${ring.alpha})`;
        ctx.lineWidth = 1;
        ctx.setLineDash(ring.dash);
        ctx.lineDashOffset = ring.angle * 160;
        ctx.beginPath();
        ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawHomeBase() {
      const cx = hb.x + hb.shakeX;
      const cy = hb.y + hb.shakeY;
      const half = hb.size / 2;

      for (const sw of shockwaves) {
        ctx.save();
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.lineWidth = 1.5;
        ctx.strokeRect(cx - sw.size / 2, cy - sw.size / 2, sw.size, sw.size);
        ctx.restore();
      }

      ctx.save();
      let strokeColor = '#ffffff';
      let shadowColor = 'rgba(255,255,255,0.25)';
      let shadowBlur = 10;
      let lineWidth = 2;

      if (hb.redGlow > 0.01) {
        strokeColor = hb.redGlow > 0.5 ? '#ff2244' : '#b83348';
        shadowColor = '#ff2244';
        shadowBlur = 35 * hb.redGlow;
        lineWidth = 2 + 2.5 * hb.redGlow;
      } else if (hb.greenGlow > 0.01) {
        strokeColor = '#00ff88';
        shadowColor = '#00ff88';
        shadowBlur = 32 * hb.greenGlow;
        lineWidth = 2 + 2 * hb.greenGlow;
      }

      ctx.strokeStyle = strokeColor;
      ctx.shadowColor = shadowColor;
      ctx.shadowBlur = shadowBlur;
      ctx.lineWidth = lineWidth;

      const gapHalf = 14 * hb.gateOpen;
      ctx.beginPath();
      if (hb.gateOpen > 0.05 && hb.gateSide === 'top') {
        const gx = cx + hb.gatePos;
        ctx.moveTo(cx - half, cy - half);
        ctx.lineTo(Math.max(cx - half, gx - gapHalf), cy - half);
        ctx.moveTo(Math.min(cx + half, gx + gapHalf), cy - half);
        ctx.lineTo(cx + half, cy - half);
      } else {
        ctx.moveTo(cx - half, cy - half);
        ctx.lineTo(cx + half, cy - half);
      }
      if (hb.gateOpen > 0.05 && hb.gateSide === 'right') {
        const gy = cy + hb.gatePos;
        ctx.moveTo(cx + half, cy - half);
        ctx.lineTo(cx + half, Math.max(cy - half, gy - gapHalf));
        ctx.moveTo(cx + half, Math.min(cy + half, gy + gapHalf));
        ctx.lineTo(cx + half, cy + half);
      } else {
        ctx.moveTo(cx + half, cy - half);
        ctx.lineTo(cx + half, cy + half);
      }
      if (hb.gateOpen > 0.05 && hb.gateSide === 'bottom') {
        const gx = cx + hb.gatePos;
        ctx.moveTo(cx + half, cy + half);
        ctx.lineTo(Math.min(cx + half, gx + gapHalf), cy + half);
        ctx.moveTo(Math.max(cx - half, gx - gapHalf), cy + half);
        ctx.lineTo(cx - half, cy + half);
      } else {
        ctx.moveTo(cx + half, cy + half);
        ctx.lineTo(cx - half, cy + half);
      }
      if (hb.gateOpen > 0.05 && hb.gateSide === 'left') {
        const gy = cy + hb.gatePos;
        ctx.moveTo(cx - half, cy + half);
        ctx.lineTo(cx - half, Math.min(cy + half, gy + gapHalf));
        ctx.moveTo(cx - half, Math.max(cy - half, gy - gapHalf));
        ctx.lineTo(cx - half, cy - half);
      } else {
        ctx.moveTo(cx - half, cy + half);
        ctx.lineTo(cx - half, cy - half);
      }
      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.fillStyle = hb.redGlow > 0.3 ? '#ff2244' : (hb.greenGlow > 0.2 ? '#00ff88' : '#ffffff');
      ctx.font = '600 18px "JetBrains Mono", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('HomeBase', cx, cy);
      ctx.restore();
    }

    function drawSquares() {
      for (const sq of squares) {
        const isHovered = (sq === hoveredSquare);
        const isDimmedReplay = sq.isPastReplay && sq.state !== 'INSIDE';
        const isAmbient = !sq.isClaimed;

        // Motion trails: faint swirling wisps in STORM, stronger trails on FLYING_IN / REJECTED_OUT
        if (sq.trail.length > 1) {
          ctx.save();
          if (isDimmedReplay && sq.state !== 'STORM') ctx.setLineDash([3, 4]);
          ctx.beginPath();
          for (let i = 0; i < sq.trail.length; i++) {
            const pt = sq.trail[i];
            if (i === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          }
          ctx.strokeStyle = sq.color;
          if (sq.state === 'STORM') {
            ctx.globalAlpha = isAmbient ? 0.07 : (isDimmedReplay ? 0.14 : 0.16);
            ctx.lineWidth = 1;
          } else {
            ctx.globalAlpha = isDimmedReplay ? 0.26 : 0.45;
            ctx.lineWidth = 1.4;
          }
          ctx.stroke();
          ctx.restore();
        }

        if (sq.state === 'WAITING_LOCK') {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 190, 11, 0.45)';
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(sq.x, sq.y);
          ctx.lineTo(
            Math.max(hb.x - hb.size / 2, Math.min(hb.x + hb.size / 2, sq.x)),
            Math.max(hb.y - hb.size / 2, Math.min(hb.y + hb.size / 2, sq.y))
          );
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.translate(sq.x, sq.y);
        ctx.rotate(sq.angle);

        const s = sq.size;

        if (!isDimmedReplay && (sq.state === 'WAITING_LOCK' || sq.state === 'FLYING_IN' || sq.pulse > 0 || isHovered)) {
          ctx.shadowColor = sq.color;
          ctx.shadowBlur = isHovered ? 16 : 10;
        }

        ctx.strokeStyle = isHovered ? '#ffffff' : sq.color;
        ctx.lineWidth = isHovered ? 2 : 1.3;
        ctx.fillStyle = sq.isClaimed ? sq.color : 'rgba(71, 85, 105, 0.15)';

        if (isAmbient && !isHovered) {
          ctx.globalAlpha = 0.22;
        } else if (isDimmedReplay && !isHovered) {
          ctx.globalAlpha = (sq.state === 'FLYING_IN' || sq.state === 'REJECTED_OUT') ? 0.54 : 0.34;
        } else {
          ctx.globalAlpha = sq.isClaimed ? 0.88 : 0.42;
        }

        ctx.fillRect(-s / 2, -s / 2, s, s);
        ctx.globalAlpha = isAmbient && !isHovered ? 0.32 : (isDimmedReplay && !isHovered ? 0.58 : 1.0);
        ctx.strokeRect(-s / 2, -s / 2, s, s);
        ctx.restore();

        // Floating timestamp & IP on lunging past failed attempts
        if (isDimmedReplay && (sq.state === 'FLYING_IN' || sq.state === 'REJECTED_OUT') && sq.replayStamp) {
          ctx.save();
          ctx.font = '500 9.5px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillStyle = 'rgba(215, 110, 125, 0.72)';
          ctx.fillText(sq.replayStamp, sq.x, sq.y - sq.size - 7);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.42)';
          ctx.fillText(sq.ip, sq.x, sq.y + sq.size + 12);
          ctx.restore();
        }

        if (isHovered) {
          ctx.save();
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 1;
          const r = sq.size + 6;
          ctx.strokeRect(sq.x - r, sq.y - r, r * 2, r * 2);
          ctx.restore();
        }
      }

      for (const p of particles) {
        ctx.save();
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        ctx.restore();
      }
    }

    function loop() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, W, H);

      updatePhysics();
      drawVortexBackdrop();
      drawHomeBase();
      drawSquares();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
