<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurora</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-color: #333;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(360deg, hsla(214, 65%, 69%, 1), hsla(214, 83%, 58%, 1) 100%, hsla(216, 76%, 37%, 1));
            overflow: hidden;
            color: var(--text-color);
        }

        /* Responsive Scaling for Mobile (Zoom Out Effect) */
        @media (max-width: 768px) {
            html { font-size: 14px; }
            #input-container { width: 95%; padding: 8px 12px; }
            .message-bubble { max-width: 90% !important; padding: 12px 16px !important; }
            header { font-size: 1.3rem !important; padding: 10px !important; }
            #chat-area { padding-bottom: 120px !important; }
        }

        /* Faster Intro Animation */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        #intro-screen.slide-up { transform: translateY(-100%); }
        
        .typing-text {
            font-size: 3rem; font-weight: 300; letter-spacing: 2px;
            border-right: 3px solid #333;
            white-space: nowrap; overflow: hidden;
            width: 0; animation: typing 0.9s steps(6) forwards, blink 0.75s step-end infinite;
        }

        @keyframes typing { from { width: 0 } to { width: 4.5em; } }
        @keyframes blink { 50% { border-color: transparent } }

        /* Upgraded Premium Glassmorphism */
        .glass {
            background: rgba(255, 255, 255, 0.35); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.8); 
            box-shadow: 
                0 16px 40px 0 rgba(0, 0, 0, 0.08), 
                0 0 30px rgba(255, 255, 255, 0.4), 
                inset 0 0 25px rgba(255, 255, 255, 0.3);
        }

        /* Subtle Floating Animation for Elements */
        @keyframes float-anim {
            0% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-3px) rotate(0.5deg); }
            66% { transform: translateY(2px) rotate(-0.5deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .float-hover {
            animation: float-anim 6s ease-in-out infinite;
        }

        /* Main App Layout */
        #app { height: 100%; display: flex; flex-direction: column; position: relative; }

        header {
            /* Changed to shrink-wrap the text so it rotates exactly around the center */
            align-self: center; 
            padding: 15px 30px; font-size: 1.5rem; font-weight: 200; cursor: pointer;
            z-index: 10; text-align: center; user-select: none;
            transition: opacity 0.3s, color 0.3s;
            transform-origin: center;
        }
        header:hover { opacity: 0.6; }

        /* Header Shaking Animation */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(1px, 1px) rotate(2deg); }
            50% { transform: translate(0, 0) rotate(0deg); }
            75% { transform: translate(-1px, -1px) rotate(-2deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        header.shaking {
            animation: shake 0.4s infinite;
            color: rgba(255, 255, 255, 0.9);
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        #chat-area {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
            padding-bottom: 140px; 
            margin-top: -3.58rem;
        }
        
        /* Message Layout & Animations */
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(15px) scale(0.8); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-wrapper {
            display: flex; width: 100%;
            opacity: 0; 
        }
        .message-wrapper.pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.3) forwards;
        }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.bot { justify-content: flex-start; }

        .message-bubble { 
            padding: 15px 20px; border-radius: 24px; max-width: 75%; 
            line-height: 1.5; font-size: 1rem;
            position: relative;
            white-space: pre-wrap; 
        }
        
        .message-wrapper.user .message-bubble { 
            border-bottom-right-radius: 6px; 
            background: rgba(255, 255, 255, 0.75); 
        }
        .message-wrapper.bot .message-bubble { 
            border-bottom-left-radius: 6px; 
            background: rgba(255, 255, 255, 0.45); 
        }

        /* Input Wrapper */
        #input-positioner {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; pointer-events: none;
            z-index: 50;
        }
        #input-container {
            width: 90%; max-width: 800px; border-radius: 30px;
            display: flex; align-items: flex-end; padding: 10px 15px;
            pointer-events: auto;
        }

        .icon-btn {
            opacity: 0.5;
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.4); margin-right: 10px; flex-shrink: 0;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 2px;
        }
        #send-btn { margin-right: 0; margin-left: 10px; opacity: 0.9; }
        
        .icon-btn:hover { background: rgba(255,255,255,0.9); transform: scale(1.1); opacity: 0.8; }
        .icon-btn.active { background: #333; color: white; opacity: 1;}

        /* Multi-line Textarea (Fixed resizing glitch) */
        textarea {
            flex: 1; background: transparent; border: none; outline: none;
            font-size: 1rem; color: #333; resize: none; font-family: inherit;
            height: 42px; /* Hard lock to button height initially */
            box-sizing: border-box; /* Crucial for strict padding calculation */
            padding: 10px 5px; 
            line-height: 22px; /* 10+10 padding + 22 height = 42 exactly */
            max-height: 120px; overflow-y: auto;
            margin-bottom: 2px;
        }
        textarea::-webkit-scrollbar { width: 0; }
        
        #file-input { display: none; }

        /* Modal Options Menu Overlay */
        #options-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.15); backdrop-filter: blur(5px);
            z-index: 100; display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #options-overlay.active { opacity: 1; pointer-events: all; }

        #options-menu {
            width: 90%; max-width: 600px; max-height: 85vh;
            display: flex; flex-direction: column; gap: 20px;
            padding: 30px; box-sizing: border-box; overflow-y: auto;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 30px;
        }
        #options-overlay.active #options-menu { transform: translateY(0) scale(1); }
        
        .top-menu-bar { display: flex; justify-content: space-between; align-items: center; }
        .bubbly-btn {
            background: rgba(255,255,255,0.4); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 10px 20px; cursor: pointer; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); font-weight: 500;
        }
        .bubbly-btn:hover { background: rgba(255,255,255,0.9); transform: scale(1.05); }

        .menu-section { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .menu-title { font-size: 1.2rem; font-weight: 500; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 10px; }

        .auth-box { display: flex; gap: 10px; }
        .auth-box input { border-radius: 10px; border: 1px solid var(--glass-border); padding: 10px; flex: 1; background: rgba(255,255,255,0.3); }
        .auth-box button { border-radius: 10px; border: none; padding: 10px 20px; cursor: pointer; background: #fff; transition: 0.2s; }
        .auth-box button:hover { transform: scale(1.05); }

        .model-select { display: flex; flex-direction: column; gap: 10px; }
        .model-btn {
            text-align: left; padding: 15px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.2); cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .model-btn:hover { background: rgba(255,255,255,0.6); transform: translateX(5px); }
        .model-btn.selected { background: rgba(255,255,255,0.9); font-weight: bold; transform: scale(1.02); border-color: #aaa; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        #history-list { overflow-y: auto; max-height: 200px; display: flex; flex-direction: column; gap: 10px; padding-right: 5px; }
        .history-item { 
            padding: 15px; border-radius: 10px; background: rgba(255,255,255,0.3);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            transition: all 0.2s ease;
        }
        .history-item:hover { background: rgba(255,255,255,0.7); transform: scale(1.01); }
        
        .history-actions { display: flex; gap: 10px; }
        .action-btn { font-size: 1.2rem; cursor: pointer; background: none; border: none; transition: transform 0.2s; }
        .action-btn:hover { transform: scale(1.2); }

        .svg-icon { width: 1.2em; height: 1.2em; fill: currentColor; vertical-align: middle; }

        .katex { font-size: 1.1em; }

    </style>

    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <!-- KaTeX JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- KaTeX Auto-render Extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="window.katexReady = true;"></script>
    
</head>
<body>

    <!-- Intro Overlay -->
    <div id="intro-screen">
        <div class="typing-text">Aurora</div>
    </div>

    <div id="app">
        <!-- Header -->
        <header id="main-header" onclick="newChat()">Aurora</header>

        <!-- Chat Area -->
        <main id="chat-area">
            <!-- Messages go here dynamically -->
        </main>
        
        <!-- Input Bar with Wrapper for centering independent of float -->
        <div id="input-positioner">
            <div id="input-container" class="glass float-hover">
                <button class="icon-btn" id="attach-btn" onclick="document.getElementById('file-input').click()" title="Attach Image">
                    <svg class="svg-icon" viewBox="0 0 256 256"><path d="M213.65723,66.34326l-40-40A8.00076,8.00076,0,0,0,168,24H88A16.01833,16.01833,0,0,0,72,40V56H56A16.01833,16.01833,0,0,0,40,72V216a16.01833,16.01833,0,0,0,16,16H168a16.01833,16.01833,0,0,0,16-16V200h16a16.01833,16.01833,0,0,0,16-16V72A8.00035,8.00035,0,0,0,213.65723,66.34326ZM136,192H88a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Zm0-32H88a8,8,0,0,1,0-16h48a8,8,0,0,1,0,16Zm64,24H184V104a8.00035,8.00035,0,0,0-2.34277-5.65674l-40-40A8.00076,8.00076,0,0,0,136,56H88V40h76.68652L200,75.314Z"></path></svg>
                </button>
                <input type="file" id="file-input" accept="image/*" onchange="handleImage(event)">
                
                <button class="icon-btn" onclick="toggleOptions()" title="Options Menu">
                    <svg class="svg-icon" viewBox="0 0 24.75 24.75"><path d="M0,3.875c0-1.104,0.896-2,2-2h20.75c1.104,0,2,0.896,2,2s-0.896,2-2,2H2C0.896,5.875,0,4.979,0,3.875z M22.75,10.375H2 c-1.104,0-2,0.896-2,2c0,1.104,0.896,2,2,2h20.75c1.104,0,2-0.896,2-2C24.75,11.271,23.855,10.375,22.75,10.375z M22.75,18.875H2 c-1.104,0-2,0.896-2,2s0.896,2,2,2h20.75c1.104,0,2-0.896,2-2S23.855,18.875,22.75,18.875z"></path></svg>
                </button>
                
                <textarea id="prompt-input" rows="1" placeholder="Message..." oninput="autoResize(this)" onkeydown="handleKeyDown(event)"></textarea>

                <button class="icon-btn" id="send-btn" onclick="triggerSend()" title="Send Message">
                    <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Options Overlay Modal -->
    <div id="options-overlay" onclick="closeOverlay(event)">
        <div id="options-menu" class="glass float-hover">
            
            <div class="top-menu-bar">
                <button class="bubbly-btn glass" onclick="newChat()">New Chat</button>
                <button class="bubbly-btn glass" onclick="toggleOptions()">Close</button>
            </div>

            <!-- Section 1: Sign in -->
            <div class="menu-section glass">
                <div class="menu-title" id="auth-title">Sign In</div>
                <div class="auth-box" id="login-box">
                    <input type="text" id="user-id-input" placeholder="Enter your ID...">
                    <button onclick="login()">Sign In</button>
                </div>
                <div class="auth-box" id="logout-box" style="display: none;">
                    <span id="current-user-display" style="line-height: 40px; flex: 1;"></span>
                    <button onclick="logout()">Sign Out</button>
                </div>
            </div>

            <!-- Section 2: AI Models -->
            <div class="menu-section glass">
                <div class="menu-title">Select Aurora</div>
                <div class="model-select">
                    <button class="model-btn selected" data-model="DWS:Aurora" onclick="setModel('DWS:Aurora')">Aurora (Base)</button>
                    <button class="model-btn" data-model="DWS:Swift" onclick="setModel('DWS:Swift')">Swift (Quick)</button>
                    <button class="model-btn" data-model="DWS:Avani" onclick="setModel('DWS:Avani')">Avani (Smartest)</button>
                    <button class="model-btn" data-model="DWS:Optic" onclick="setModel('DWS:Optic')">Optic (Image Sensing)</button>
                </div>
            </div>

            <!-- Section 3: History -->
            <div class="menu-section glass">
                <div class="menu-title">Conversation History</div>
                <div id="history-list">
                    <!-- History populates here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://device.teamexist.com/port/5101";
        let currentChatId = null;
        let selectedModel = 'DWS:Aurora';
        let attachedImageBase64 = null;

        // Intro Logic
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('intro-screen').classList.add('slide-up');
                checkCookieAuth();
            }, 1200); 
        };

        // --- Keyboard Handling ---
        function autoResize(el) {
            el.style.height = '42px'; // Temporarily shrink to measure true height
            if (el.scrollHeight > 42) {
                el.style.height = Math.min(el.scrollHeight, 120) + 'px';
            }
        }

        function handleKeyDown(e) {
            // Check if user is on a precision pointer device (aka Desktop/Laptop mouse)
            const isDesktop = window.matchMedia("(pointer: fine)").matches;
            
            if (isDesktop && e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); // Prevents typing a new line
                triggerSend();
            }
        }

        // --- Core UI functions ---
        function toggleOptions() {
            const overlay = document.getElementById('options-overlay');
            overlay.classList.toggle('active');
            if(overlay.classList.contains('active')) loadHistory();
        }
        
        function closeOverlay(e) {
            if(e.target === document.getElementById('options-overlay')) toggleOptions();
        }

        function newChat() {
            currentChatId = null;
            document.getElementById('chat-area').innerHTML = '';
            document.getElementById('options-overlay').classList.remove('active');
        }

        function setModel(modelName) {
            selectedModel = modelName;
            document.querySelectorAll('.model-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.getAttribute('data-model') === modelName) btn.classList.add('selected');
            });
        }

        function handleImage(event) {
            try {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    attachedImageBase64 = e.target.result.split(',')[1];
                    document.getElementById('attach-btn').classList.add('active');
                    setModel('DWS:Optic');
                };
                reader.readAsDataURL(file);
            } catch (err) { console.error("Error handling image:", err); }
        }

        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }

        function checkCookieAuth() {
            const userId = getCookie('aurora_user_id');
            if(userId) {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('logout-box').style.display = 'flex';
                document.getElementById('current-user-display').innerText = `Signed in as: ${userId}`;
                loadHistory();
            }
        }

        async function login() {
            const userId = document.getElementById('user-id-input').value;
            if(!userId) return;
            try {
                const res = await fetch(API_BASE + '/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({user_id: userId})
                });
                if (!res.ok) throw new Error(`HTTP error!`);
                checkCookieAuth();
            } catch (err) { console.error("Login Error:", err); }
        }

        async function logout() {
            try {
                await fetch(API_BASE + '/api/logout', {method: 'POST'});
                document.getElementById('login-box').style.display = 'flex';
                document.getElementById('logout-box').style.display = 'none';
                document.getElementById('history-list').innerHTML = '';
                newChat();
            } catch (err) { console.error("Logout Error:", err); }
        }

        async function loadHistory() {
            if(!getCookie('aurora_user_id')) return;
            try {
                const res = await fetch(API_BASE + '/api/history');
                if (!res.ok) throw new Error(`HTTP error!`);
                const history = await res.json();
                
                const list = document.getElementById('history-list');
                list.innerHTML = '';
                
                history.forEach(chat => {
                    const div = document.createElement('div');
                    div.className = 'history-item glass float-hover';
                    div.style.animationDuration = (4 + Math.random()*3) + 's'; 
                    
                    const titleSpan = document.createElement('span');
                    titleSpan.innerText = chat.title;
                    titleSpan.onclick = () => loadChat(chat.id);
                    titleSpan.style.flex = 1;
                    
                    const actionDiv = document.createElement('div');
                    actionDiv.className = 'history-actions';

                    const starBtn = document.createElement('button');
                    starBtn.className = 'action-btn';
                    // Fixed: Changed innerText to innerHTML and wrapped the SVG in backticks (`)
                    starBtn.innerHTML = chat.starred ? `<svg class="svg-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"><path fill="#000000" d="M256 38.013c-22.458 0-66.472 110.3-84.64 123.502-18.17 13.2-136.674 20.975-143.614 42.334-6.94 21.358 84.362 97.303 91.302 118.662 6.94 21.36-22.286 136.465-4.116 149.665 18.17 13.2 118.61-50.164 141.068-50.164 22.458 0 122.9 63.365 141.068 50.164 18.17-13.2-11.056-128.306-4.116-149.665 6.94-21.36 98.242-97.304 91.302-118.663-6.94-21.36-125.444-29.134-143.613-42.335-18.168-13.2-62.182-123.502-84.64-123.502z"></path></g></svg>` : '☆';
                    starBtn.onclick = (e) => {
                        e.stopPropagation();
                        toggleStar(chat.id, !chat.starred, starBtn);
                    };
                    
                    const delBtn = document.createElement('button');
                    delBtn.className = 'action-btn';
                    // Fixed: Changed innerText to innerHTML and wrapped the SVG in backticks (`)
                    delBtn.innerHTML = `<svg class="svg-icon" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 41.336 41.336" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g> <path d="M36.335,5.668h-8.167V1.5c0-0.828-0.672-1.5-1.5-1.5h-12c-0.828,0-1.5,0.672-1.5,1.5v4.168H5.001c-1.104,0-2,0.896-2,2 s0.896,2,2,2h2.001v29.168c0,1.381,1.119,2.5,2.5,2.5h22.332c1.381,0,2.5-1.119,2.5-2.5V9.668h2.001c1.104,0,2-0.896,2-2 S37.438,5.668,36.335,5.668z M14.168,35.67c0,0.828-0.672,1.5-1.5,1.5s-1.5-0.672-1.5-1.5v-21c0-0.828,0.672-1.5,1.5-1.5 s1.5,0.672,1.5,1.5V35.67z M22.168,35.67c0,0.828-0.672,1.5-1.5,1.5s-1.5-0.672-1.5-1.5v-21c0-0.828,0.672-1.5,1.5-1.5 s1.5,0.672,1.5,1.5V35.67z M25.168,5.668h-9V3h9V5.668z M30.168,35.67c0,0.828-0.672,1.5-1.5,1.5s-1.5-0.672-1.5-1.5v-21 c0-0.828,0.672-1.5,1.5-1.5s1.5,0.672,1.5,1.5V35.67z"></path> </g> </g></svg>`;
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteChat(chat.id);
                    };

                    actionDiv.appendChild(starBtn);
                    actionDiv.appendChild(delBtn);
                    div.appendChild(titleSpan);
                    div.appendChild(actionDiv);
                    list.appendChild(div);
                });
            } catch (err) { console.error("Load History Error:", err); }
        }

        async function toggleStar(chatId, makeStarred, btnElement) {
            try {
                const res = await fetch(API_BASE + `/api/star/${chatId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({starred: makeStarred})
                });
                if (!res.ok) throw new Error(`HTTP error!`);
                btnElement.innerText = makeStarred ? '⭐' : '☆';
                loadHistory(); 
            } catch (err) {}
        }

        async function deleteChat(chatId) {
            try {
                const res = await fetch(API_BASE + `/api/chat/${chatId}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP error!`);
                if (currentChatId === chatId) newChat(); 
                loadHistory(); 
            } catch (err) {}
        }

        async function loadChat(chatId) {
            try {
                currentChatId = chatId;
                toggleOptions();
                document.getElementById('chat-area').innerHTML = '';
                
                const res = await fetch(API_BASE + `/api/chat/${chatId}`);
                if (!res.ok) throw new Error(`HTTP error!`);
                const messages = await res.json();
                
                messages.forEach(msg => {
                    const wrap = appendMessage(msg.role, msg.content);
                    wrap.classList.add('pop-in'); 
                });
            } catch (err) { console.error("Load Chat Error:", err); }
        }

        function appendMessage(role, content) {
            const chatArea = document.getElementById('chat-area');
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}`;
            
            const bubble = document.createElement('div');
            bubble.className = `message-bubble glass float-hover`;
            bubble.style.animationDelay = `-${Math.random() * 2}s`;
            
            // Use innerHTML instead of innerText to support formatted text/math parsing
            bubble.innerHTML = content;

            wrapper.appendChild(bubble);
            chatArea.appendChild(wrapper);
            return wrapper;
        }

        function renderMathInElement(element) {
            if (window.renderMathInElement && window.katexReady) {
                window.renderMathInElement(element, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '\\(', right: '\\)', display: false},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true}
                    ],
                    throwOnError: false
                });
            }
        }
        
        // --- Sophisticated Physics-Based Paper Plane Animation (Sending) ---
        function triggerSend() {
            const input = document.getElementById('prompt-input');
            const message = input.value.trim();
            if (!message) return;
            
            input.value = '';
            input.style.height = '42px'; // Firmly reset textarea height

            const userMsgWrapper = appendMessage('user', message);
            const sendBtn = document.getElementById('send-btn');
            const btnRect = sendBtn.getBoundingClientRect();
            const chatArea = document.getElementById('chat-area');
            
            chatArea.scrollTop = chatArea.scrollHeight;
            
            const targetBubble = userMsgWrapper.querySelector('.message-bubble');
            const targetRect = targetBubble.getBoundingClientRect();

            const plane = document.createElement('div');
            plane.innerHTML = sendBtn.innerHTML;
            plane.style.position = 'fixed';
            plane.style.left = '0px';
            plane.style.top = '0px';
            plane.style.width = btnRect.width + 'px';
            plane.style.height = btnRect.height + 'px';
            plane.style.zIndex = '2000';
            plane.style.color = '#333';
            plane.style.display = 'flex';
            plane.style.justifyContent = 'center';
            plane.style.alignItems = 'center';
            plane.style.pointerEvents = 'none';
            document.body.appendChild(plane);

            const startX = btnRect.left;
            const startY = btnRect.top;
            const endX = targetRect.right - (btnRect.width * 1.2); 
            const endY = targetRect.top + (targetRect.height / 2) - (btnRect.height / 2);

            const steps = 70; 
            const points = [];
            
            const depthModifier = Math.random() < 0.5 ? 0.6 : -0.6;
            const baseScale = 1.2; 

            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let easeT = 1 - Math.pow(1 - t, 4); 
                let bx = startX + (endX - startX) * easeT;
                let by = startY + (endY - startY) * easeT;
                
                let loopX = Math.sin(t * Math.PI * 2) * 120; 
                let loopY = -Math.sin(t * Math.PI) * 220;
                
                let wiggleFactor = Math.sin(t * Math.PI);
                let wiggleX = Math.cos(t * Math.PI * 14) * 6 * wiggleFactor;
                let wiggleY = Math.sin(t * Math.PI * 14) * 6 * wiggleFactor;
                
                points.push({ x: bx + loopX + wiggleX, y: by + loopY + wiggleY, t: t });
            }

            const keyframes = [];
            for (let i = 0; i <= steps; i++) {
                let p = points[i];
                let prevP = points[Math.max(i - 1, 0)];
                let nextP = points[Math.min(i + 1, steps)];
                
                let dx, dy;
                if (i === steps) {
                    dx = p.x - prevP.x; dy = p.y - prevP.y;
                } else if (i === 0) {
                    dx = nextP.x - p.x; dy = nextP.y - p.y;
                } else {
                    dx = nextP.x - prevP.x; dy = nextP.y - prevP.y;
                }
                
                let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 45;
                let currentScale = baseScale + (Math.sin(p.t * Math.PI) * depthModifier);
                let opacity = 1;

                if (i > steps - 5) { 
                    let pop = (i - (steps - 5)) / 5; 
                    currentScale = currentScale + (pop * 1.0); 
                    opacity = 1 - pop; 
                }

                keyframes.push({
                    transform: `translate(${p.x}px, ${p.y}px) rotate(${angle}deg) scale(${currentScale})`,
                    opacity: opacity
                });
            }

            const anim = plane.animate(keyframes, { duration: 1100, easing: 'linear', fill: 'forwards' });

            anim.onfinish = () => {
                plane.remove();
                userMsgWrapper.classList.add('pop-in');
                chatArea.scrollTop = chatArea.scrollHeight;
                executeApiCall(message);
            };
        }

        // --- Physics-Based Paper Plane Animation (Receiving) ---
        function triggerReceive(botMessageText = '') {
            const chatArea = document.getElementById('chat-area');
            const botMsgWrapper = appendMessage('bot', botMessageText);
            
            chatArea.scrollTop = chatArea.scrollHeight;
            
            const targetBubble = botMsgWrapper.querySelector('.message-bubble');
            const targetRect = targetBubble.getBoundingClientRect();
            const header = document.getElementById('main-header');
            const headerRect = header.getBoundingClientRect();
            const sendBtn = document.getElementById('send-btn'); 

            const plane = document.createElement('div');
            plane.innerHTML = sendBtn.innerHTML;
            plane.style.position = 'fixed';
            plane.style.left = '0px';
            plane.style.top = '0px';
            plane.style.width = '42px'; 
            plane.style.height = '42px';
            plane.style.zIndex = '2000';
            
            // --- NEW: Make the return plane white and glowing ---
            plane.style.color = 'white'; 
            plane.style.filter = 'drop-shadow(0px 0px 8px rgba(255, 255, 255, 0.9))';
            
            plane.style.display = 'flex';
            plane.style.justifyContent = 'center';
            plane.style.alignItems = 'center';
            plane.style.pointerEvents = 'none';
            document.body.appendChild(plane);

            const startX = headerRect.left + (headerRect.width / 2) - 21; 
            const startY = headerRect.bottom - 10;
            const endX = targetRect.left + 10; 
            const endY = targetRect.top + (targetRect.height / 2) - 21;

            const steps = 70; 
            const points = [];
            const depthModifier = Math.random() < 0.5 ? 0.6 : -0.6;
            const baseScale = 1.2; 

            for (let i = 0; i <= steps; i++) {
                let t = i / steps;
                let easeT = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 
                let bx = startX + (endX - startX) * easeT;
                let by = startY + (endY - startY) * easeT;
                let loopX = Math.sin(t * Math.PI * 2) * -120; 
                let loopY = Math.sin(t * Math.PI) * 150;      
                let wiggleFactor = Math.sin(t * Math.PI); 
                let wiggleX = Math.cos(t * Math.PI * 14) * 6 * wiggleFactor;
                let wiggleY = Math.sin(t * Math.PI * 14) * 6 * wiggleFactor;
                points.push({ x: bx + loopX + wiggleX, y: by + loopY + wiggleY, t: t });
            }

            const keyframes = [];
            for (let i = 0; i <= steps; i++) {
                let p = points[i];
                let prevP = points[Math.max(i - 1, 0)];
                let nextP = points[Math.min(i + 1, steps)];
                
                let dx, dy;
                if (i === steps) {
                    dx = p.x - prevP.x; dy = p.y - prevP.y;
                } else if (i === 0) {
                    dx = nextP.x - p.x; dy = nextP.y - p.y;
                } else {
                    dx = nextP.x - prevP.x; dy = nextP.y - prevP.y;
                }
                
                let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 45;
                let currentScale = baseScale + (Math.sin(p.t * Math.PI) * depthModifier);
                let opacity = 1;

                if (i < 10) { currentScale = currentScale * (i / 10); }

                if (i > steps - 5) { 
                    let pop = (i - (steps - 5)) / 5; 
                    currentScale = currentScale + (pop * 1.0); 
                    opacity = 1 - pop; 
                }

                keyframes.push({
                    transform: `translate(${p.x}px, ${p.y}px) rotate(${angle}deg) scale(${currentScale})`,
                    opacity: opacity
                });
            }

            const anim = plane.animate(keyframes, { duration: 1100, easing: 'linear', fill: 'forwards' });

            anim.onfinish = () => {
                plane.remove();
                botMsgWrapper.classList.add('pop-in');
                chatArea.scrollTop = chatArea.scrollHeight;
            };

            return targetBubble; // <--- ADD THIS LINE
            
        }

        async function executeApiCall(message) {
        const payload = { chat_id: currentChatId, model: selectedModel, message: message };

        if (attachedImageBase64) {
            payload.images = [attachedImageBase64];
            attachedImageBase64 = null;
            document.getElementById('attach-btn').classList.remove('active');
            document.getElementById('file-input').value = ""; 
        }

        const chatArea = document.getElementById('chat-area');
        const header = document.getElementById('main-header');
        
        header.classList.add('shaking');

        try {
            const res = await fetch(API_BASE + '/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            
            if (!res.ok) {
                const errText = await res.text();
                header.classList.remove('shaking');
                const bubble = triggerReceive();
                bubble.innerText = "Error: " + errText;
                return;
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let done = false;
            
            let botBubble = null;
            let isFirstChunk = true;

            while (!done) {
                const { value, done: readerDone } = await reader.read();
                done = readerDone;

                if (value) {
                    const chunkStr = decoder.decode(value, {stream: true});
                    const lines = chunkStr.split('\n');

                    for (const line of lines) {
                        if (!line.trim()) continue;
                        try {
                            const data = JSON.parse(line);

                            if (data.type === 'start') {
                                if (data.chat_id) currentChatId = data.chat_id;
                            } 
                            else if (data.type === 'chunk') {
                                if (isFirstChunk) {
                                    header.classList.remove('shaking');
                                    botBubble = triggerReceive(); // Fires the plane animation
                                    isFirstChunk = false;
                                }
                                if (botBubble) {
                                    // Accumulate raw text and filter asterisks if desired
                                    botBubble.rawText = (botBubble.rawText || '') + data.content.replace(/\*/g, '');
                                    
                                    // Set HTML and render KaTeX
                                    botBubble.innerHTML = botBubble.rawText;
                                    renderMathInElement(botBubble);
                                    
                                    chatArea.scrollTop = chatArea.scrollHeight;
                                }
                            }
                            else if (data.type === 'error') {
                                if (isFirstChunk) {
                                    header.classList.remove('shaking');
                                    botBubble = triggerReceive();
                                    isFirstChunk = false;
                                }
                                if (botBubble) botBubble.innerText += "\n\n[Error]: " + data.content;
                            }
                        } catch (parseErr) {
                            console.error("Stream parse error:", parseErr);
                        }
                    }
                }
            }
        } catch (err) {
            header.classList.remove('shaking');
            const bubble = triggerReceive();
            bubble.innerText = "Network error connecting to the backend.";
        }
    }
