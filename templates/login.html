<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway</title>
    <style>
        body {
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, hsla(202, 30%, 35%, 1) 2%, hsla(217, 100%, 16%, 1) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        /* 1. MAIN PANEL */
        .glass-panel {
            position: relative;
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.4); 
            border-radius: 24px;
            padding: 40px;
            
            box-shadow: 
                0 16px 40px 0 rgba(0, 0, 0, 0.4), 
                0 0 30px rgba(255, 255, 255, 0.1), 
                inset 0 0 25px rgba(255, 255, 255, 0.1);
                
            text-align: center;
            animation: fadein 1s ease-out;
            transition: transform 0.5s ease;
        }

        /* 2. PADLOCK SHACKLE WRAPPER */
        .shackle-wrapper {
            position: absolute;
            top: -130.8px; 
            height: 130px; 
            left: 45px; 
            right: 45px;
            z-index: -1;
            
            transform-origin: 12px 100%;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 16px rgba(0, 0, 0, 0.5));
        }

        /* 3. FROSTED GLASS TUBE */
        .shackle-glass {
            position: absolute;
            inset: 0;
            box-sizing: border-box;
            border: 24px solid rgba(255, 255, 255, 0.08); 
            border-bottom: none; 
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
            
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            
            -webkit-mask: 
                linear-gradient(#fff 0 0) padding-box, 
                linear-gradient(#fff 0 0) border-box;
            -webkit-mask-composite: xor;
            mask: 
                linear-gradient(#fff 0 0) padding-box, 
                linear-gradient(#fff 0 0) border-box;
            mask-composite: exclude;
        }

        /* 4. THE CRISP 1px WHITE BORDERS */
        .shackle-lines {
            position: absolute;
            inset: 0; 
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: none;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
        }
        .shackle-lines::after {
            content: '';
            position: absolute;
            inset: 23px 23px 0 23px; 
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-bottom: none;
            border-top-left-radius: 37px; 
            border-top-right-radius: 37px;
        }

        /* --- 5. LOGO GLITCH ANIMATIONS --- */
        .logo {
            position: relative;
            width: 150px; 
            height: 150px; 
            margin: 0 auto 20px auto;
        }

        .logo svg { 
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%; 
            fill: #fff; 
        }

        /* Initial DWS Logo */
        #dws-logo {
            animation: dws-glitch-out 2.5s forwards;
        }

        /* New Keyhole Logo */
        #keyhole-logo {
            opacity: 0;
            animation: keyhole-glitch-in 2.5s forwards;
        }

        /* White Blocks Glitch Overlay */
        .logo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            animation: glitch-blocks 2.5s forwards;
        }

        /* Holds for 2s (80% of 2.5s), then jitters, slices, and vanishes */
        @keyframes dws-glitch-out {
            0%, 80% { opacity: 1; transform: translate(0); clip-path: none; filter: none; }
            81% { transform: translate(-8px, 4px) skewX(10deg); filter: drop-shadow(4px 0 0 rgba(255,255,255,0.8)); clip-path: inset(10% 0 60% 0); }
            83% { transform: translate(8px, -4px) skewX(-15deg); filter: drop-shadow(-4px 0 0 rgba(255,255,255,0.8)); clip-path: inset(50% 0 20% 0); }
            85% { transform: translate(-4px, 8px); clip-path: inset(0 0 80% 0); }
            86%, 100% { opacity: 0; display: none; }
        }

        /* Flashes white bands horizontally across the container */
        @keyframes glitch-blocks {
            0%, 80% { opacity: 0; }
            81% { opacity: 1; clip-path: polygon(0 15%, 100% 15%, 100% 25%, 0 25%); }
            83% { opacity: 1; clip-path: polygon(0 65%, 100% 65%, 100% 80%, 0 80%); }
            85% { opacity: 1; clip-path: polygon(0 5%, 100% 5%, 100% 10%, 0 10%, 0 85%, 100% 85%, 100% 95%, 0 95%); }
            86%, 100% { opacity: 0; }
        }

        /* Smashes in instantly after the DWS logo disappears, settles quickly */
        @keyframes keyhole-glitch-in {
            0%, 85% { opacity: 0; }
            86% { opacity: 1; transform: translate(-6px, 6px) skewX(20deg) scale(0.85); filter: brightness(2); clip-path: inset(20% 0 40% 0); }
            88% { transform: translate(6px, -6px) skewX(-10deg) scale(0.85); filter: brightness(1.5); clip-path: inset(60% 0 10% 0); }
            90% { transform: translate(0, 0) skewX(0) scale(0.85); filter: none; clip-path: none; }
            100% { opacity: 1; transform: scale(0.85); } /* Scale 0.85 keeps its visual weight balanced with the DWS logo */
        }

        /* --- 6. UNLOCK ANIMATIONS --- */
        .unlocked .shackle-wrapper {
            transform: translateY(-40px) rotate(-15deg);
        }
        .unlocked {
            transform: scale(0.95);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        @keyframes fadein { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        input[type="password"] {
            width: 250px; padding: 15px 20px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2);
            color: white; font-size: 16px; outline: none; transition: all 0.3s ease;
            box-sizing: border-box;
        }
        input[type="password"]:focus {
            background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="glass-panel" id="panel">
        
        <div class="shackle-wrapper">
            <div class="shackle-glass"></div>
            <div class="shackle-lines"></div>
        </div>

        <!-- Animated Glitching Logos -->
        <div class="logo">
            <!-- Starting DWS Logo -->
            <svg id="dws-logo" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg">
                <path d="M69 374v11h31v313H69v11l77.75-.01c43.662-.006 83.011-.454 89.75-1.021 28.198-2.374 53.519-7.612 72.5-15 53.384-20.78 82.612-61.786 90.145-126.47 1.491-12.81 1.448-45.925-.077-59.5-2.43-21.632-8.156-43.26-15.136-57.171-19.551-38.962-52.654-61.214-105.432-70.87-23.798-4.353-39.025-4.947-126.75-4.952zm846.156 5.7c-61.099 4.116-105.456 39.6-117.77 96.3-2.433 11.207-2.382 37.1.1 51.5 9.186 53.276 40.548 80.677 117.178 102.38 67.023 18.983 91.238 34.388 97.797 62.214 1.734 7.355 1.97 22.318.459 28.879-5.38 23.351-28.157 39.846-59.406 43.025-12.932 1.315-794.84 1.149-807.014-.172-26.649-2.891-52.374-17.28-79.004-44.185-18.514-18.707-34.407-40.452-47.572-65.09L14.822 645H9.471c-2.944 0-5.547.338-5.785.75-.679 1.175 5.01 130.951 5.796 132.223.392.634 2.493 1 4.766.83 3.843-.287 4.238-.628 7.297-6.3 5.962-11.053 9.739-11.882 31.955-7.01 22.635 4.962 47.011 9.45 61 11.228 13.223 1.68 36.985 1.779 428 1.779h414l12-2.217c55.046-10.17 92.266-44.668 103.879-96.283 4.047-17.988 4.5-41.963 1.156-61.143-4.944-28.35-18.785-51.266-40.715-67.41-19.661-14.474-42.004-23.623-88.82-36.365-42.632-11.603-61.607-19.839-74.795-32.46-28.102-26.899-15.286-72.716 23.793-85.061 28.336-8.952 57.242-3.34 82.658 16.048 18.942 14.45 39.853 40.651 58.772 73.641l6.74 11.75H1052l.023-4.75c.045-9.3-3.185-104.79-3.62-107-.348-1.778-1.12-2.25-3.673-2.25-2.639 0-4.07.951-7.809 5.191-4.505 5.11-4.68 5.198-11 5.569-5.047.296-9.31-.393-19.921-3.22-35.92-9.575-43.658-11.113-63.678-12.655-9.367-.722-18.438-.774-27.166-.186zM195.5 385.5l12.5.219c36.691.644 56.86 8.614 70.627 27.906 11.312 15.853 17.779 40.266 20.365 76.875 1.288 18.22 1.292 79.572.006 96.105-5.758 74.038-27.446 105.595-75.853 110.374-5.696.562-14.36 1.021-19.254 1.021h-8.897l.252-156.25zM702 411.975V420h17.117c15.799 0 17.083.135 16.686 1.75C727.024 457.486 696.4 577 696.023 577c-.291 0-11.597-35.212-25.125-78.25l-24.595-78.25 9.847-.285 9.85-.285V412H556v8h19.895l4.625 14.75c2.543 8.113 7.067 22.46 10.052 31.885 2.986 9.424 5.43 17.974 5.432 19 .005 2.351-26.326 94.343-27.004 94.344-.275 0-12.696-35.882-27.604-79.739l-27.105-79.74 11.855-.281 11.854-.281V412H423v7.919l8.123.29 8.123.291 43.627 119.764L526.5 660.027l16.408-.263 16.41-.264 21.641-75.217c11.903-41.37 21.855-75.43 22.115-75.691s7.128 19.862 15.262 44.717a41638 41638 0 0 0 24.935 75.941L653.416 660h33.191l31.946-119.75L750.5 420.5l11.5-.5 11.5-.5v-7l-35.75-.262z"/></svg>
            
            <!-- Ending Keyhole Logo -->
            <svg id="keyhole-logo" viewBox="0 0 28.457 28.456" xmlns="http://www.w3.org/2000/svg">
                <path d="M21.015,6.986c0,2.627-1.449,4.916-3.593,6.108c3.991,15.362,3.991,15.362,3.991,15.362s-13.619,0-14.144,0 c4.145-14.989,0,0,4.145-14.989C8.853,12.433,7.042,9.92,7.042,6.986C7.042,3.127,10.169,0,14.028,0 C17.888,0,21.015,3.127,21.015,6.986z"/>
            </svg>
        </div>
        
        <form method="POST" id="loginForm" onsubmit="handleLogin(event)">
            <input type="password" id="password" name="password" placeholder="Authentication Code" autofocus autocomplete="off">
            <input type="hidden" name="lat" id="gps_lat">
            <input type="hidden" name="lon" id="gps_lon">
        </form>
    </div>

    <script>
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('gps_lat').value = pos.coords.latitude;
                    document.getElementById('gps_lon').value = pos.coords.longitude;
                },
                (err) => { console.log("GPS Location declined or unavailable:", err.message); },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        async function handleLogin(event) {
            event.preventDefault();
            const form = document.getElementById('loginForm');
            const formData = new FormData(form);
            
            const response = await fetch(window.location.href, {
                method: 'POST',
                body: formData
            });

            if (response.redirected) {
                document.getElementById('panel').classList.add('unlocked');
                setTimeout(() => {
                    window.location.href = response.url;
                }, 600);
            } else {
                window.location.reload();
            }
        }
    </script>
</body>
</html>
