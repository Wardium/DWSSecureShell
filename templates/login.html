<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway</title>
    <style>
        body {
            margin: 0; padding: 0;
            height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: linear-gradient(135deg, hsla(202, 30%, 35%, 1) 2%, hsla(217, 100%, 16%, 1) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }
        
        /* Lock Shackle */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 80px;
            border: 12px solid rgba(255, 255, 255, 0.2);
            border-bottom: none;
            border-top-left-radius: 50px;
            border-top-right-radius: 50px;
            z-index: -1;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-panel {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: fadein 1s ease-out;
            transition: transform 0.5s ease;
        }

        /* Unlock Animations */
        .unlocked::before {
            transform: translateX(-50%) translateY(-30px) rotate(-15deg);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .unlocked {
            transform: scale(0.95);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        @keyframes fadein { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .logo svg { width: 150px; height: 150px; fill: #fff; }
        
        input[type="password"] {
            width: 250px; padding: 15px 20px; border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.2);
            color: white; font-size: 16px; outline: none; transition: all 0.3s ease;
        }
        input[type="password"]:focus {
            background: rgba(0, 0, 0, 0.4); border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="glass-panel" id="panel">
        <div class="logo">
            <!-- SVG Logo omitted for brevity -->
        </div>
        <form method="POST" id="loginForm" onsubmit="handleLogin(event)">
            <input type="password" id="password" name="password" placeholder="Authentication Code" autofocus autocomplete="off">
            <input type="hidden" name="lat" id="gps_lat">
            <input type="hidden" name="lon" id="gps_lon">
        </form>
    </div>

<script>
        // Request device GPS in the background
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    document.getElementById('gps_lat').value = pos.coords.latitude;
                    document.getElementById('gps_lon').value = pos.coords.longitude;
                },
                (err) => {
                    console.log("GPS Location declined or unavailable:", err.message);
                },
                { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
            );
        }

        // Handle Login with Animation
        async function handleLogin(event) {
            event.preventDefault();
            const form = document.getElementById('loginForm');
            const formData = new FormData(form);
            
            const response = await fetch(window.location.href, {
                method: 'POST',
                body: formData
            });

            if (response.redirected) {
                // Success: Trigger animation
                document.getElementById('panel').classList.add('unlocked');
                
                // Wait for animation to finish before redirecting
                setTimeout(() => {
                    window.location.href = response.url;
                }, 600);
            } else {
                // Failed: Reload or show error
                window.location.reload();
            }
        }
    </script>
</body>
</html>
