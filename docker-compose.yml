version: '3.8'

services:
  dws-secure-shell:
    build: .
    container_name: dws-secure-shell
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # This bind mount links your host directory to the container's /app directory.
      # Any edits you make to app.py or the templates folder on the host will be instantly available on restart.
      - ./:/app
    environment:
      - PYTHONUNBUFFERED=1
